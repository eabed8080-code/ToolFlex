<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolFlex - YouTube Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #333333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .main-container {
            text-align: center;
            width: 100%;
            max-width: 650px;
            padding: 0 20px;
        }
        .logo {
            font-size: 42px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 6px;
        }
        .logo span {
            color: #dc2626;
        }
        .subtitle {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 35px;
        }
        .card {
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .input-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }
        .yt-icon {
            position: absolute;
            left: 14px;
            width: 20px;
            height: 20px;
            fill: #dc2626;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 14px 14px 44px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #dc2626;
        }
        select {
            padding: 14px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 14px;
            background-color: #f9fafb;
            color: #374151;
            outline: none;
            cursor: pointer;
        }
        select:focus {
            border-color: #dc2626;
        }
        button {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            white-space: nowrap;
        }
        button:hover {
            background-color: #b91c1c;
        }
        #status {
            margin-top: 18px;
            font-size: 14px;
            color: #6b7280;
        }
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1 class="logo">Tool<span>Flex</span></h1>
        <p class="subtitle">Fast & Simple YouTube Downloader</p>

        <div class="card">
            <div class="input-wrapper">
                <svg class="yt-icon" viewBox="0 0 24 24">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
                <input type="text" id="videoUrl" placeholder="Paste YouTube link here..." required>
            </div>

            <select id="formatType">
                <option value="video">Video (MP4)</option>
                <option value="audio">Audio (MP3)</option>
            </select>

            <button id="downloadBtn" onclick="downloadMedia()">Download</button>
        </div>

        <div id="status"></div>

        <div class="footer">
            © 2026 ToolFlex. For educational purposes only.
        </div>
    </div>

    <script>
        async function downloadMedia() {
            const url = document.getElementById('videoUrl').value;
            const formatType = document.getElementById('formatType').value;
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('downloadBtn');

            if (!url) {
                statusDiv.innerText = "Please enter a valid link.";
                statusDiv.style.color = "#dc2626";
                return;
            }

            btn.innerText = "Fetching...";
            btn.disabled = true;
            statusDiv.innerText = "Processing media download...";
            statusDiv.style.color = "#6b7280";

            try {
                const response = await fetch(`/api/download?url=${encodeURIComponent(url)}&format_type=${formatType}`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error("Download failed. Please check the URL.");
                }

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;

                const contentDisposition = response.headers.get('content-disposition');
                let fileName = formatType === 'audio' ? 'audio.mp3' : 'video.mp4';
                if (contentDisposition && contentDisposition.includes('filename=')) {
                    fileName = contentDisposition.split('filename=')[1].replace(/"/g, '');
                }

                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();

                statusDiv.innerText = "Download completed successfully!";
                statusDiv.style.color = "#16a34a";
            } catch (err) {
                statusDiv.innerText = err.message;
                statusDiv.style.color = "#dc2626";
            } finally {
                btn.innerText = "Download";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
